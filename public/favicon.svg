<svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <path id="pin" d="M 50,0 C 22.38,0 0,22.38 0,50 C 0,85 50,120 50,120 C 50,120 100,85 100,50 C 100,22.38 77.62,0 50,0 Z" />
    <clipPath id="pinClip">
      <use href="#pin" />
    </clipPath>
  </defs>
  
  <use href="#pin" fill="#3CA4FF" />
  
  <g clip-path="url(#pinClip)">
    <circle cx="50" cy="35" r="18" fill="white" />
    
    <!-- Left Hill (Darker) -->
    <path d="M -10,80 Q 20,60 55,90 L 50,130 L -10,130 Z" fill="#00723F" />
    
    <!-- Right Hill (Lighter) -->
    <path d="M 40,90 Q 75,50 110,80 L 110,130 L 40,130 Z" fill="#55B55A" />
    
    <!-- House -->
    <g transform="translate(50, 75)">
      <!-- Background -->
      <path d="M -15,0 L 0,-15 L 15,0 L 12,0 L 12,15 L -12,15 L -12,0 Z" fill="white" />
      <!-- Orange roof -->
      <path d="M -18,2 L 0,-16 L 18,2" fill="none" stroke="#FF9800" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Orange walls -->
      <rect x="-10" y="0" width="20" height="15" fill="none" stroke="#FF9800" stroke-width="3" />
      <!-- Window -->
      <rect x="-4" y="3" width="8" height="8" fill="#FF9800" />
      <line x1="-4" y1="7" x2="4" y2="7" stroke="white" stroke-width="1.5" />
      <line x1="0" y1="3" x2="0" y2="11" stroke="white" stroke-width="1.5" />
    </g>
  </g>
</svg>
